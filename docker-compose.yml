# 创建专用网络（默认已隔离）
networks:
  bridge_network:
    driver: bridge

services:

  # 后端服务
  backend:
    restart: always  # 设置容器随 Docker 服务启动而自动重启
    build:
      context: ./backend           # Dockerfile 所在目录
      dockerfile: Dockerfile          # 后端 Dockerfile
    container_name: backend
    environment:
      DB_PATH: /data/data.db        # SQLite 数据库文件路径
    volumes:
      - ./data:/data                # 数据库绑定到宿主机目录，便于持久化/迁移
    command: /opt/backend/evalflow    # 启动
    networks:
      - bridge_network

  # Nginx 前端服务
  frontend:
    restart: always  # 设置容器随 Docker 服务启动而自动重启
    image: nginx:latest               # LTS 版本
    container_name: frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html                    # 挂载前端构建产物
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf     # 挂载自定义 nginx 配置
    networks:
      - bridge_network
    ports:
      - "1001:80"
    depends_on:
      - backend
